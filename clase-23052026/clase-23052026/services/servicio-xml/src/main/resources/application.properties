server.port=8005
spring.application.name=servicio-xml
springdoc.swagger-ui.path=/swagger-ui.html

# Permite [ ] en query params (necesario para expresiones XPath como //libro[precio>50])
# Por defecto Tomcat rechaza estos caracteres por el RFC 3986, pero son válidos en XPath
server.tomcat.relaxed-query-chars=[,]
