server.port=8007
spring.application.name=servicio-registro
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# URLs internas — para health checks entre contenedores (Docker DNS)
# En Docker se sobreescriben con los nombres de contenedor (soa-libros, etc.)
libros.service.url=http://localhost:8001
usuarios.service.url=http://localhost:8002
prestamos.service.url=http://localhost:8003
soap.service.url=http://localhost:8004/ws
xml.service.url=http://localhost:8005

# URLs externas — las que se muestran al cliente (navegador/Postman)
# Siempre usan localhost porque el cliente es externo al Docker network
libros.display.url=http://localhost:8001
usuarios.display.url=http://localhost:8002
prestamos.display.url=http://localhost:8003
soap.display.url=http://localhost:8004/ws
xml.display.url=http://localhost:8005
registro.display.url=http://localhost:8007
