server.port=8001
spring.application.name=servicio-libros

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info

# ── Seguridad por API Key (Sesión 8 — Lab de Seguridad) ──────────────────────
security.api-key.enabled=false
security.api-key.value=biblioteca-soa-2026

# ── PostgreSQL (Sesiones 17-18) ───────────────────────────────────────────────
# ${VAR:default} → usa la env var si existe, si no usa el default.
# En Docker: POSTGRES_HOST=soa-postgres (nombre del contenedor = DNS interno).
# En desarrollo local: localhost.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/biblioteca
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# DDL automático: 'update' crea tablas si no existen, mantiene datos existentes.
# NUNCA usar 'create-drop' en producción — borra todo al apagar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# data.sql: carga datos iniciales después de que JPA crea las tablas.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
